[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scopeproof"
version = "0.1.5"
description = "A tiny scope and architecture guardrail for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ScopeProof Contributors" }]
maintainers = [{ name = "SomeTimeDev" }]
keywords = [
  "ai-agents",
  "coding-agents",
  "codex",
  "guardrails",
  "code-review",
  "static-analysis",
  "git",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
  "rich>=13.0",
  "pathspec>=0.12",
]

[project.urls]
Homepage = "https://github.com/SomeTimeDev/scopeproof"
Repository = "https://github.com/SomeTimeDev/scopeproof"
Issues = "https://github.com/SomeTimeDev/scopeproof/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
scopeproof = "scopeproof.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["scopeproof*"]

[tool.setuptools.package-data]
"scopeproof.templates" = ["*.yml", "*.md"]
